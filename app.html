<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8">
          <title>FitBro</title>
          <link rel="stylesheet" href="./css/app.css">
     </head>

     <body>
          <div class="app">

               <section id="calendar-section">
               </section>

               <section id="daily-session-section">

                    <section class="calendar-header">
                         <div class="calendar-row">
                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Mon
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              
                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Tue
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Wed
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Thu
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Fri
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Sat
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Sun
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                         </div>
                    </section>

                    <section class="session-title">
                         <div class="session-text">
                              <h2 class="today-text">
                                   Today's Session: 
                              </h2>

                              <span class="js-day">
                                   (Temp) Leg Day
                              </span>
                         </div>
                    </section>

                    <section class="exercise-container">
                         <!-- Add open to the details to always show drop down -->
                         <details class="exercise-phase" open>
                              <summary class="warm-up js-phase">
                                   Warm Up
                              </summary>

                              <div class="phase-exercises">
                                   <div class="exercise-top">
                                        <h3 class="js-exercise-title">
                                             (Temp) Cat-Cow
                                        </h3>

                                        <p class="js-exercise-sets-reps">
                                             (Temp)2 x 60 seconds
                                        </p>
                                   </div>

                                   <div class="exercise-middle">
                                        <div class="middle-left">
                                             <button class="timer">
                                                  Timer
                                             </button>

                                             <button class="demo">
                                                  Press For Demo
                                             </button>

                                             <button class="swap">
                                                  Swap
                                             </button>
                                        </div>

                                        <span class="exercise-check-status">
                                             Check
                                        </span>
                                   </div>

                                   <div class="exercise-bottom">
                                        <details class="instructions-container" open>
                                             <summary class="instructions">
                                                  Instructions
                                             </summary>

                                             <ol class="instructions-list">
                                                  <li class="js-instructions-list-item">
                                                       (Temp)Instruction 1
                                                  </li>

                                                  <li class="js-instructions-list-item">
                                                       (Temp)Instruction 2
                                                  </li>
                                             </ol>
                                        </details>

                                        <details class="tips-container" open>
                                             <summary class="summary-tips">
                                                  Tips
                                             </summary>

                                             <ul class="tips-list">
                                                  <li class="js-tips-list-item">
                                                       (Temp)Tip 1
                                                  </li>

                                                  <li class="js-tips-list-item">
                                                       (Temp)Tip 2
                                                  </li>
                                             </ul>
                                        </details>
                                   </div>
                              </div>
                         </details>

                    </section>

                    <div class="log-workout-container">
                              <button class="log-workout-button">
                                   Press to Complete Session and Log Workout
                              </button>
                         </div>

               </section>

               <section id="ask-ai-session">
               </section>

               <section id="user-settings-section">
               </section>
          </div>
     </body>
</html>
