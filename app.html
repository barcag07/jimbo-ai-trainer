<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>FitBro</title>
          <link rel="stylesheet" href="./css/app.css">
          <script src="./js/app.js" defer></script>
     </head>

     <body>
          <p class="demo-text" style="text-align: center; margin: 2rem;">The project is using a mock json exercise session file</p>

          <div class="app">

               <section id="calendar-section">
               </section>

               <section id="daily-session-section">

                    <section class="calendar-header">
                         <div class="calendar-row">
                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Mon
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              
                              <div class="calendar-day-column">
                                   <p class="calendar-day">
                                        Tue
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Wed
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Thu
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Fri
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Sat
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                              <div class="calendar-day-column">
                                   <p class="dalendar-day">
                                        Sun
                                   </p>

                                   <span class="check-status">
                                        Check
                                   </span>
                              </div>

                         </div>
                    </section>

                    <section class="session-title">
                         <div class="session-text">
                              <h2 class="today-text">
                                   Today's Session: 
                              </h2>

                              <h2 class="js-day">
                                   
                              </h2>
                         </div>
                    </section>

                    <section class="exercise-container">
                         

                    </section>

                    <div class="log-workout-container">
                              <button class="log-workout-button">
                                   Press to Complete Session and Log Workout
                              </button>
                         </div>

               </section>

               <section id="ask-ai-session">
               </section>

               <section id="user-settings-section">
               </section>
          </div>
     </body>
</html>
